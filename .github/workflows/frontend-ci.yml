name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "client/hospital/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "client/hospital/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/hospital

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build